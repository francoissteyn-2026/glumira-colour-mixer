    <button id="install-desktop" type="button" hidden style="position:fixed;top:8px;right:8px;z-index:20;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:#E6CD32;color:#102347;font:600 14px system-ui,sans-serif;cursor:pointer">Install on desktop</button>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
      let deferredInstall;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstall = event;
        const button = document.getElementById("install-desktop");
        button.hidden = false;
        button.onclick = async () => {
          button.hidden = true;
          deferredInstall.prompt();
          await deferredInstall.userChoice;
          deferredInstall = null;
        };
      });
    </script>
